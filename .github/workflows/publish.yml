name: Publish win-x64
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to maintain the rolling "latest-dev" release

jobs:
  publish:
    # UBUNTU, for a Windows build. This started as a billing decision - private-repository
    # minutes are metered with a 2x multiplier on Windows, and this was the one workflow that
    # had to survive an exhausted quota - and that reason is now HISTORY: the repository is
    # public, so runners are free and unmetered either way.
    #
    # It stays on Linux because the reason it worked is not about money. A non-AOT
    # self-contained publish is a cross-compile the SDK supports: it restores the win-x64
    # runtime pack and lays it out, rather than invoking a native toolchain. Verified rather
    # than assumed - this exact command on Linux produces "PE32+ executable (console)
    # x86-64, for MS Windows" plus every native dependency (cimgui.dll, WebView2Loader.dll,
    # oo2core.dll) and the schema, data and ui folders beside it. It also starts faster than
    # a Windows runner, and the check below makes a wrong result loud rather than silent.
    #
    # AOT is the case that genuinely cannot cross-compile, which is why its gate in ci.yml
    # is on windows-latest. If this job ever does come back to Windows, the shell in the
    # steps below has to come back to pwsh with it.
    runs-on: ubuntu-latest
    steps:
      # FULL HISTORY, not the default single commit. The release notes are the changelog the
      # tool's own update tab shows, and building one means listing the commits between the
      # build the release currently carries and this one - which a shallow clone cannot do.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # BEFORE the build, because it reads what the release holds RIGHT NOW - the build that
      # is about to be replaced. That sha is the "since" of the changelog below, and it is the
      # only place it is recorded: a rolling tag has one release and no history of its own.
      - name: Read the build the release currently carries
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download latest-dev -p version.json -O previous.json 2>/dev/null; then
            echo "commit=$(jq -r '.commit // ""' previous.json)" >> "$GITHUB_OUTPUT"
          else
            # First run, or a release from before the update check existed. Both mean "no
            # previous build to compare against", and the notes say so rather than guessing.
            echo "commit=" >> "$GITHUB_OUTPUT"
          fi

      # Self-contained single file: runs on any Windows without a .NET install.
      # (AOT off here for speed; the AOT publish gets its own verification pass later.)
      - run: >
          dotnet publish src/PoEformance.App -c Release -r win-x64
          --self-contained
          -p:PublishSingleFile=true
          -p:PublishAot=false

      # WHAT THIS BUILD IS, written next to the executable so the copy somebody is running can
      # say. Nothing else can: every build goes out under the same rolling tag, and the
      # assembly version has been 1.0.0.0 since the first commit - neither distinguishes this
      # week's build from March's. The tool reads this file at startup and compares it against
      # the copy of it uploaded to the release; see Features/BuildStamp.
      #
      # The SAME file is uploaded as a release asset below, which is what makes the comparison
      # exact rather than inferred from a timestamp: both sides were written here, by this
      # step, in this run.
      - name: Stamp the build
        run: |
          out="src/PoEformance.App/bin/Release/net10.0-windows/win-x64/publish"
          cat > "$out/version.json" <<EOF
          {
            "tag": "latest-dev",
            "commit": "${{ github.sha }}",
            "builtUtc": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')",
            "runNumber": ${{ github.run_number }}
          }
          EOF
          cp "$out/version.json" version.json
          cat version.json

      # Fails loudly if the layout is not what a Windows user needs. On a cross-compile this
      # is worth asserting rather than trusting: the failure mode of a wrong RID is a publish
      # folder that looks plausible and holds no exe, and the release would go out empty.
      - name: Check the publish produced a Windows build
        run: |
          out="src/PoEformance.App/bin/Release/net10.0-windows/win-x64/publish"
          test -f "$out/PoEformance.App.exe" || { echo "no exe produced"; exit 1; }
          file "$out/PoEformance.App.exe" | grep -q "MS Windows" || {
            echo "not a Windows binary:"; file "$out/PoEformance.App.exe"; exit 1; }
          test -f "$out/schema/poe2.offsets.json" || { echo "no schema beside the exe"; exit 1; }
          # A zip without this ships a build that cannot tell whether it is current, and the
          # symptom is an update tab that says "local build" on a downloaded release.
          test -f "$out/version.json" || { echo "no version.json beside the exe"; exit 1; }
          ls -la "$out"

      - name: Zip the publish output
        run: |
          cd src/PoEformance.App/bin/Release/net10.0-windows/win-x64/publish
          zip -qr "$GITHUB_WORKSPACE/PoEformance-win-x64.zip" .

      # THE RELEASE FIRST, and that ordering is the whole point of this arrangement. It is
      # what anybody actually downloads; the artifact below is a convenience. With the
      # artifact first, one failure there aborts the job before the release is touched -
      # which is exactly what happened when the artifact storage quota filled up: the build
      # was fine, the zip was fine, and the download URL quietly kept serving the previous
      # commit, crash and all. A rolling release that silently stops rolling is worse than
      # no rolling release.
      #
      # Rolling release: one stable download URL that always carries the newest build.
      # First run creates it; every later run replaces the asset and refreshes the notes.
      - name: Update the latest-dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Written to a file rather than passed inline: the notes are full of backticks,
          # and every layer that would otherwise have to be escaped through is one more
          # place for the release notes to come out mangled.
          #
          # THE NOTES ARE THE CHANGELOG THE TOOL SHOWS. The update tab renders this body
          # verbatim, so "automatic build of <sha>" - which is what this said for its whole
          # life - is a changelog that answers nothing: somebody deciding whether to restart
          # mid-session wants to know what they are getting, and a commit id is not that.
          previous='${{ steps.previous.outputs.commit }}'
          {
            echo "Automatic build of \`${{ github.sha }}\` ($(date -u '+%Y-%m-%d %H:%M') UTC)."
            echo

            if [ -n "$previous" ] && git cat-file -e "${previous}^{commit}" 2>/dev/null; then
              count=$(git rev-list --no-merges --count "${previous}..${{ github.sha }}")
              if [ "$count" -eq 0 ]; then
                echo "No commits since the previous build - this is a rebuild."
              else
                echo "### ${count} change(s) since \`$(echo "$previous" | cut -c1-7)\`"
                echo
                # Merge commits left out: this repository merges pull requests, so the
                # first-parent line reads "Merge pull request #186 from ..." while the
                # commits underneath carry the sentences somebody actually wrote.
                git log --no-merges --pretty='- %s' "${previous}..${{ github.sha }}" | head -60
                if [ "$count" -gt 60 ]; then
                  echo "- ... and $((count - 60)) more"
                fi
              fi
            else
              # Either the first stamped release, or a previous build whose commit is not in
              # this clone (a force-push, a rewritten branch). Saying so beats an empty list
              # that reads as "nothing changed".
              echo "No previous stamped build to compare against."
            fi

            echo
            echo "---"
            echo
            echo "Unzip anywhere and run \`PoEformance.App.exe\` from an elevated terminal."
            echo "\`schema\poe2.offsets.json\` sits next to the exe and stays hot-editable"
            echo "(\`--watch\`). No .NET install required."
            echo
            echo "Already running it? The tool checks this release on its own and can install"
            echo "the update itself - config window, Update tab."
          } > notes.md

          # version.json goes up BESIDE the zip, as its own asset. It is a couple of hundred
          # bytes and it is what the running tool fetches to decide whether it is current -
          # asking for the whole zip to answer that question would be a hundred and fifty
          # megabytes per check.
          if gh release view latest-dev >/dev/null 2>&1; then
            gh release upload latest-dev PoEformance-win-x64.zip version.json --clobber
            gh release edit latest-dev --notes-file notes.md
          else
            gh release create latest-dev PoEformance-win-x64.zip version.json \
              --prerelease --title "Latest build (auto)" --notes-file notes.md
          fi

      # And a per-commit copy, which is useful for fetching the build of an older commit -
      # the release only ever holds the newest.
      #
      # ALLOWED TO FAIL, because it is the optional half and it has one failure mode that has
      # nothing to do with this build: the artifact storage quota, which one of these fills at
      # a hundred-odd megabytes a push. A red publish run should mean "the release did not go
      # out", and that stays true only if this cannot turn it red.
      #
      # A week's retention rather than the ninety-day default for the same reason: the reason
      # to reach for one of these is "the build from a commit this week", and unbounded copies
      # of a self-contained runtime are what filled the quota in the first place.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PoEformance-win-x64
          path: PoEformance-win-x64.zip
          retention-days: 7
