name: Photoshare Pages

# Manual on purpose. Turning on GitHub Pages is a repository-wide decision, and
# a push trigger would paint every unrelated commit red until someone flips the
# switch in Settings -> Pages (source: GitHub Actions).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: photoshare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Only the app ships. The tests and their dependencies stay behind.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: photoshare/app
      - id: deploy
        uses: actions/deploy-pages@v4
