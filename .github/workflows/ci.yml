name: CI

# ON ICE - manual only, until the Actions quota is back.
#
# This repository is private, so Actions minutes are metered, and the account ran out of
# them. The symptom is worth writing down because it looks nothing like a billing problem:
# jobs fail in about three seconds with `runner_id: 0`, no runner name, and NO STEP LIST AT
# ALL - the job is never dispatched to a machine, so nothing is checked out and nothing is
# built. It is indistinguishable at a glance from a transient Actions outage, and the only
# way to tell them apart is that an outage recovers and this does not.
#
# What that costs is the whole reason for parking it here rather than trimming it. The
# triggers below used to be `push: ["**"]` plus `pull_request`, which is TWO runs of
# everything for every push to a branch with a PR open - and `aot-publish` runs on
# windows-latest, billed at 2x. One push therefore spent a double-digit number of billed
# minutes. Publishing the thing people download is worth minutes; re-proving a green build
# twice per push is not, when the two compete for the same empty budget.
#
# TO BRING IT BACK once the quota resets, restore the two trigger lines:
#
#     on:
#       push:
#         branches: ["**"]
#       pull_request:
#       workflow_dispatch:
#
# and consider leaving `pull_request` off - `push: ["**"]` alone already covers every branch
# and halves the bill, at the cost of not running on PRs from forks.
#
# UNTIL THEN THE TESTS STILL RUN, just not here: `dotnet build --nologo` and
# `dotnet test --nologo --no-build` are exactly what this job does, and they cost nothing
# locally. Run them before pushing, because nothing else is going to.
on:
  workflow_dispatch:
    inputs:
      aot:
        description: "Also run the Native AOT gate (windows-latest, billed at 2x)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # EnableWindowsTargeting in Directory.Build.props lets the net10.0-windows
      # projects compile here too, so the whole solution is checked on every push.
      - run: dotnet build --nologo
      - run: dotnet test --nologo --no-build

  # THE Native AOT gate - the deployment risk this project carries, measured on every
  # push instead of discovered at ship time. Publishing with PublishAot compiles the
  # whole dependency graph through ILC: the overlay stack (ClickableTransparentOverlay,
  # ImGui.NET, Vortice), the WebView2 config window (source-generated COM), and our own
  # code. A failure here is real information about exactly which dependency breaks AOT;
  # green here means the ONLY remaining AOT question is runtime behaviour, which needs a
  # live Windows run. Cross-OS AOT publishing is unsupported, hence the Windows runner.
  #
  # Waits for test, which is what the question needs anyway: "does this compile through
  # ILC" is not worth asking about code that does not compile through Roslyn, and a broken
  # build otherwise fails here too and reports it as an AOT problem. Starting after test
  # also stops the two jobs racing each other through GitHub's action-resolution service,
  # which is where CI #95 and #96 both died - "Failed to resolve action download info,
  # Service Unavailable", before checkout, while the ubuntu job resolved the same two
  # actions in the same minute. That is GitHub's infrastructure and not something a
  # workflow can fix, so this is not offered as the cure; it just removes one way to
  # collide, and it is the right shape regardless.
  #
  # OPT-IN while the budget is short. It is the most expensive thing in this repository -
  # windows-latest at 2x, several minutes of ILC - and it answers a question that only
  # changes when a DEPENDENCY does, not on every run. Someone dispatching this workflow to
  # check that the tests still pass should not spend five times the test job's minutes to
  # find out; tick the box on the run that changes a package reference.
  aot-publish:
    needs: test
    if: ${{ inputs.aot }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet publish src/PoEformance.App -c Release -r win-x64 -p:PublishAot=true
      - name: Show what AOT produced
        shell: pwsh
        run: |
          $out = "src/PoEformance.App/bin/Release/net10.0-windows/win-x64/publish"
          Get-ChildItem $out -Recurse -File | Select-Object @{n='file';e={$_.FullName.Substring($out.Length+1)}}, @{n='KB';e={[math]::Round($_.Length/1KB)}} | Format-Table -AutoSize
          if (-not (Test-Path "$out/PoEformance.App.exe")) { throw "no exe produced" }
